{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - DayTone AI</title>

    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>🌤️ DayTone AI</h1>

        <h2>👤 My Profile</h2>

        <hr>

        <h3>Welcome, {{ user.username }} ❤️</h3>

        <div class="info">
            <p><strong>Username:</strong> {{ user.username }}</p>

            <p><strong>Email:</strong> {{ user.email }}</p>
        </div>

        <div class="info">

            <h3>📊 Your Account</h3>

            <p>You are currently logged in to DayTone AI.</p>

        </div>

        <div class="navigation">

            <a href="{% url 'dashboard' %}">📊 Dashboard</a>

            <a href="{% url 'home' %}">😊 Mood Tracker</a>

            <a href="{% url 'logout' %}">🚪 Logout</a>

        </div>

    </div>

</body>

</html>
